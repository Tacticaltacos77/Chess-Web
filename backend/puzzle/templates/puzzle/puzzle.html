{% extends "base.html" %}
{% load django_vite %}

{% block title %}Random Puzzle{% endblock %}

{% block extra_head %}
    {% vite_asset 'src/puzzle/main.js' %}
{% endblock %}

{% block content %}
    <div class="puzzle-layout">
        <div id="board"
             data-pieces="{{ request.user.board_settings.pieces_style|default:'standard' }}"
             data-board="{{ request.user.board_settings.board_style|default:'default' }}"></div>
        <aside class="side-panel">
            <section class="play-puzzle">
                <header class="side-panel-header"><h2>Random Puzzle</h2></header>
                <div class="side-panel-body">
                    <label>Rated
                        <button type="button" role="switch" class="toggle-button" id="puzzle-rated-toggle"><span class="toggle-knob"></button>
                    </label>
                </div>
                <footer class ="side-panel-footer"> 
                    <button type="button" id="play-button" class="play-button">Play</button>
                </footer>
            <section>
            <div class="in-progress">
                <h2>Puzzle</h2>
                <p id="puzzle-status">Find the best move.</p>
            </div>
        </aside> 

    </div>
{% endblock %}
