{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Chess{% endblock %}</title>
    {% block extra_head %}{% endblock %}
    <style>
        :root {
            --board-light: #f0d9b5;
            --board-dark: #b58863;
            --ink: #2b2320;
            --ink-soft: #6b5d52;
            --accent: #7a9e5f;
            --surface: #ffffff;
            --surface-alt: #faf6f0;
            --border: #e3d5c5;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            background: var(--surface-alt);
            color: var(--ink);
        }

        header.site-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.9rem 1.5rem;
            background: var(--ink);
            color: var(--board-light);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.25rem;
            font-weight: 700;
            text-decoration: none;
            color: var(--board-light);
        }

        .brand-icon {
            display: inline-block;
            width: 1.4rem;
            height: 1.4rem;
            background-image:
                linear-gradient(45deg, var(--board-dark) 25%, transparent 25%),
                linear-gradient(-45deg, var(--board-dark) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, var(--board-dark) 75%),
                linear-gradient(-45deg, transparent 75%, var(--board-dark) 75%);
            background-size: 0.7rem 0.7rem;
            background-position: 0 0, 0 0.35rem, 0.35rem -0.35rem, -0.35rem 0;
            background-color: var(--board-light);
            border-radius: 2px;
        }

        nav.site-nav {
            display: flex;
            gap: 1.25rem;
        }

        nav.site-nav a {
            color: var(--board-light);
            text-decoration: none;
            font-size: 0.95rem;
            opacity: 0.85;
            transition: opacity 0.15s ease;
        }

        nav.site-nav a:hover {
            opacity: 1;
            text-decoration: underline;
        }

        main.site-main {
            flex: 1;
            width: 100%;
            max-width: 960px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }


    </style>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{% url 'home' %}">
            <span class="brand-icon" aria-hidden="true"></span>
            Chess
        </a>
        <nav class="site-nav">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'play' %}">Play</a>
            <a href="{% url 'random-puzzle' %}">Puzzles</a>
        </nav>
    </header>
    <main class="site-main">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        {% block footer %}&copy; {% now "Y" %} Chess{% endblock %}
    </footer>
</body>
</html>
