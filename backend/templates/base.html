{% load static django_vite %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Chess{% endblock %}</title>
    {% vite_hmr_client %}
    <link rel="stylesheet" href="{% vite_asset_url 'src/base/base.css' %}">

    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{% url 'home' %}">
            <span class="brand-icon"></span>
            Chess
        </a>
        <nav class="site-nav">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'play' %}">Play</a>
            <a href="{% url 'puzzle' %}">Puzzles</a>
        </nav>
    </header>
    <div class="site-content">
        <main class="site-main">
            {% block content %}{% endblock %}
        </main>
    
        <footer class="site-footer">
            {% block footer %}&copy; {% now "Y" %} Chess{% endblock %}
        </footer>
    </div>

</body>
</html>
